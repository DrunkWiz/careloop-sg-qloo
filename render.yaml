services:
  - type: web
    name: careloop-sg
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd web && npm ci --include=dev && npm run build
    startCommand: uvicorn backend.api.serve:site --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
      - key: CARELOOP_SEED
        value: demo
      - key: CARELOOP_DEMO_DAYS
        value: "11"
      - key: VITE_API_URL
        value: /api
      - key: QLOO_API_KEY
        sync: false
