<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=block" rel="stylesheet">
<style>
  /* Same look as the demo video's scenes (colours sampled from CareLoop-SG-demo-general-v2.mp4). */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1500px; height: 1000px; overflow: hidden; }
  body { background: radial-gradient(ellipse 75% 85% at 58% 46%, #f9f9f7 0%, #f3f5f0 45%, #e8ede2 100%); font-family: Inter, sans-serif; }
  .left { position: absolute; left: 110px; top: 0; height: 1000px; width: 760px; display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-size: 17px; letter-spacing: .16em; text-transform: uppercase; color: #5c745c; font-weight: 500; margin-bottom: 22px; }
  .head { font-family: 'Instrument Serif', serif; font-size: 98px; line-height: .95; letter-spacing: -.025em; color: #1d2b23; white-space: pre-line; }
  .sub { font-size: 30px; line-height: 1.4; color: #5c745c; margin-top: 30px; max-width: 640px; }
  .label { position: absolute; right: 36px; top: 30px; padding: 6px 12px; border-radius: 14px; background: rgba(255,255,255,.72); color: #696d6c; font-size: 14px; }
  .phone { position: absolute; left: 960px; top: 70px; width: 410px; height: 860px; border-radius: 66px; background: #0f110f; padding: 12px; box-shadow: 0 40px 80px rgba(28,40,30,.2), 0 8px 20px rgba(28,40,30,.12); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 54px; overflow: hidden; background: #f6f7f3; }
  .screen img { width: 100%; display: block; margin-top: 46px; }  /* clear the notch, like a status bar */
  .island { position: absolute; left: 50%; top: 20px; width: 112px; height: 32px; margin-left: -56px; border-radius: 18px; background: #000; }
</style>
</head>
<body>
  <div class="label">Real app · synthetic demo data</div>
  <div class="left"><div class="kicker" id="k"></div><div class="head" id="h"></div><div class="sub" id="s"></div></div>
  <div class="phone"><div class="screen"><img id="img" alt=""><div class="island"></div></div></div>
<script>
  window.show = async ({ kicker, head, sub, src }) => {
    document.getElementById('k').textContent = kicker;
    document.getElementById('h').textContent = head;
    document.getElementById('s').textContent = sub;
    const img = document.getElementById('img');
    img.src = src;
    await img.decode();
  };
</script>
</body>
</html>
